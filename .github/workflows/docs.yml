# GitHub Actions workflow for deploying mkdocs documentation to GitHub Pages
name: docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-minify-plugin mkdocstrings[python]

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --config-file mkdocs.yml --force
