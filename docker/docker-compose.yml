# ============================================================
# DocFlow – Docker Compose Stack
# ============================================================
# Usage:
#   Development:  docker compose up -d
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   With scaling:  docker compose up -d --scale docflow-api=3
# ============================================================

name: docflow

services:
  # ─── FastAPI Application ───────────────────────────────────
  docflow-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docflow-api
    restart: unless-stopped
    ports:
      - "${DOCFLOW_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - DOCFLOW_TIKA_URL=http://tika:9998
      - DOCFLOW_REDIS_URL=redis://redis:6379/0
      - DOCFLOW_STORAGE_PATH=/data/documents
    volumes:
      - docflow-data:/data/documents
      - docflow-tmp:/data/tmp
    depends_on:
      tika:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - docflow-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # ─── Apache Tika Server ────────────────────────────────────
  tika:
    image: apache/tika:2.9.2.1
    container_name: docflow-tika
    restart: unless-stopped
    ports:
      - "${TIKA_PORT:-9998}:9998"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - docflow-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ─── Redis (Job Queue & Cache) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docflow-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - docflow-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── MinIO (S3-compatible Storage, optional) ───────────────
  minio:
    image: minio/minio:latest
    container_name: docflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-docflow}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-docflow-secret-change-me}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - docflow-net
    profiles:
      - storage  # only started with: docker compose --profile storage up

volumes:
  docflow-data:
    driver: local
  docflow-tmp:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  docflow-net:
    driver: bridge
